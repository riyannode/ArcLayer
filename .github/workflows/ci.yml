# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
#
# CI gate for pull requests — verifies build + test for runner-core and runner.
#─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runner-core
        run: pnpm --filter @arclayer/runner-core build

      - name: Build SDK
        run: pnpm --filter @arclayer/sdk build

      - name: Build circle-dev-wallet-adapter
        run: pnpm --filter @arclayer/circle-dev-wallet-adapter build

      - name: Test runner-core
        run: pnpm --filter @arclayer/runner-core test

      - name: Build runner
        run: pnpm --filter @arclayer/runner build

      - name: Test runner
        run: pnpm --filter @arclayer/runner test

  sdk-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @arclayer/sdk build
